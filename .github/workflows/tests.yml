# Project-specific CI: runs the pytest suite on every pull request and on pushes to master.
name: tests
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        # Some modules create an OpenAI client at import time. The tests mock all API calls,
        # so a fake key is enough; a real API call with it fails with an authentication error.
        env:
          OPENAI_API_KEY: "<not-a-real-key>"
        run: uv run pytest
